# ======================================================================
# LIVE PAPER CONFIGURATION — real Coinbase candles, simulated fills only.
# No orders are sent. Costs are ASSUMPTIONS: Coinbase Advanced retail taker
# fees are tiered; 0.60% is a low-volume taker tier — change to your tier.
# Volume is Coinbase-only, so VWAP is Coinbase VWAP.
# ======================================================================
config_version: "live-coinbase-1"
example: true

portfolio:
  starting_equity: 100000
  currency: USD
  risk_day_timezone: UTC
  risk_day_reset: "00:00"

instruments:
  - symbol: BTC-USD
    asset_class: crypto
    currency: USD
    tick_size: 0.01
    lot_size: 0.00000001
    min_quantity: 0.00001
    min_notional: 1
    value_per_point: 1.0
    volume_type: exchange
    session:
      timezone: UTC
      open: "00:00"
      close: "24:00"
      trading_weekdays: [0, 1, 2, 3, 4, 5, 6]
    bars:
      base_interval_minutes: 5
      four_hour_alignment: utc_epoch
      stale_gap_bars: 1
      stale_recovery_bars: 6
    costs:
      spread_ticks: 2
      slippage_ticks: 100
      commission_pct_notional: 0.006
    data:
      path: "live:coinbase"      # not read: bars come from the live feed
      synthetic: false

risk:
  max_leverage: 1.0
